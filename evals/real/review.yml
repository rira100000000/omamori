# Manual review of the real-fix cases that the pipeline got wrong (real holdout, 2026-10-20).
# Reviewed by Claude subagents and spot-checked; only wrong answers were reviewed.
#   A: label right, visible from the diff alone (a genuine miss)
#   B: label right, needs knowledge outside the diff
#   C: label mismatch (a different kind of vulnerability)  -> excluded from scoring
#   D: not a usable case (not the substance of the fix)     -> excluded from scoring
#   E: the fix itself is still vulnerable or incomplete    -> its "safe" case is excluded
#   F: the fix is safe; a genuine false positive
---
reviews:
