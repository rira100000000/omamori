id: dependency_trojan_package-safe-lockfile-version-bump
description: Gemfile.lock bumps nokogiri and puma to patched releases from rubygems.org
expected:
  dependency_trojan_package: false
files:
  - path: Gemfile.lock
    before: |
      GEM
        remote: https://rubygems.org/
        specs:
          bootsnap (1.18.4)
            msgpack (~> 1.2)
          mini_portile2 (2.8.7)
          msgpack (1.7.2)
          nio4r (2.7.3)
          nokogiri (1.16.6)
            mini_portile2 (~> 2.8.2)
            racc (~> 1.4)
          pg (1.5.8)
          puma (6.4.2)
            nio4r (~> 2.0)
          racc (1.8.1)

      PLATFORMS
        ruby

      DEPENDENCIES
        bootsnap
        nokogiri (~> 1.16)
        pg (~> 1.5)
        puma (>= 6.0)

      RUBY VERSION
         ruby 3.3.5p100

      BUNDLED WITH
         2.5.18
    after: |
      GEM
        remote: https://rubygems.org/
        specs:
          bootsnap (1.18.4)
            msgpack (~> 1.2)
          mini_portile2 (2.8.7)
