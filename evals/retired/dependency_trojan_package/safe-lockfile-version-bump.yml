            racc (~> 1.4)
          pg (1.5.8)
          puma (6.4.3)
            nio4r (~> 2.0)
          racc (1.8.1)

      PLATFORMS
        ruby

      DEPENDENCIES
        bootsnap
        nokogiri (~> 1.16)
        pg (~> 1.5)
        puma (>= 6.0)

      RUBY VERSION
         ruby 3.3.5p100

      BUNDLED WITH
