id: csrf-vulnerable-get-cancel-subscription
description: Subscription cancel link from billing emails is routed as a GET that cancels immediately for the signed-in user
expected:
  csrf: true
files:
  - path: config/routes.rb
    before: |
      Rails.application.routes.draw do
        resource :subscription, only: %i[show update] do
          post :cancel
        end
      end
    after: |
      Rails.application.routes.draw do
        resource :subscription, only: %i[show update] do
          post :cancel
          get :cancel, as: :cancel_link
        end
      end
  - path: app/controllers/subscriptions_controller.rb
    before: |
      class SubscriptionsController < ApplicationController
        before_action :authenticate_user!

        def show
          @subscription = current_user.subscription
        end

        def cancel
          current_user.subscription.cancel!(reason: params[:reason])
          redirect_to subscription_path, notice: "Your subscription has been cancelled"
        end
      end
    after: |
      class SubscriptionsController < ApplicationController
        before_action :authenticate_user!

        def show
          @subscription = current_user.subscription
        end

        def cancel
          current_user.subscription.cancel!(reason: params[:reason].presence || "email_link")
          redirect_to subscription_path, notice: "Your subscription has been cancelled"
        end
      end
  - path: app/views/billing_mailer/renewal_reminder.html.erb
    after: |
      <p>Hi <%= @user.first_name %>,</p>
      <p>Your plan renews on <%= l(@subscription.renews_on, format: :long) %>.</p>
      <p>Not using it anymore? <%= link_to "Cancel your subscription", cancel_link_subscription_url %></p>
