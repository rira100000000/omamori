id: csrf-vulnerable-json-format-forgery-exemption
description: Base controller exempts JSON-format requests from forgery protection so the SPA can post without a token, while auth stays on the session cookie
expected:
  csrf: true
files:
  - path: app/controllers/application_controller.rb
    before: |
      class ApplicationController < ActionController::Base
        protect_from_forgery with: :exception

        before_action :authenticate_user!

        private

        def authenticate_user!
          redirect_to new_session_path unless current_user
        end

        def current_user
          @current_user ||= User.find_by(id: session[:user_id])
        end
        helper_method :current_user
      end
    after: |
      class ApplicationController < ActionController::Base
        protect_from_forgery with: :exception, unless: -> { request.format.json? }

        before_action :authenticate_user!

        private

        def authenticate_user!
          return if current_user

          respond_to do |format|
            format.html { redirect_to new_session_path }
            format.json { head :unauthorized }
          end
        end

        def current_user
          @current_user ||= User.find_by(id: session[:user_id])
        end
        helper_method :current_user
      end
  - path: app/controllers/settings/notifications_controller.rb
    after: |
      module Settings
        class NotificationsController < ApplicationController
          def update
            current_user.update!(notification_email: params[:notification_email], digest_frequency: params[:digest_frequency])
            respond_to do |format|
              format.json { render json: { ok: true } }
              format.html { redirect_to settings_path }
            end
          end
        end
      end
