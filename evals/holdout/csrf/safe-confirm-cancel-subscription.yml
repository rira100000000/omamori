id: csrf-safe-confirm-cancel-subscription
description: Subscription cancel link from billing emails opens a GET confirmation page whose button submits a token-protected POST
expected:
  csrf: false
files:
  - path: config/routes.rb
    before: |
      Rails.application.routes.draw do
        resource :subscription, only: %i[show update] do
          post :cancel
        end
      end
    after: |
      Rails.application.routes.draw do
        resource :subscription, only: %i[show update] do
          get :cancel, action: :confirm_cancel, as: :confirm_cancel
          post :cancel
        end
      end
  - path: app/controllers/subscriptions_controller.rb
    before: |
      class SubscriptionsController < ApplicationController
        before_action :authenticate_user!

        def show
          @subscription = current_user.subscription
        end

        def cancel
          current_user.subscription.cancel!(reason: params[:reason])
          redirect_to subscription_path, notice: "Your subscription has been cancelled"
        end
      end
    after: |
      class SubscriptionsController < ApplicationController
        before_action :authenticate_user!

        def show
          @subscription = current_user.subscription
        end

        def confirm_cancel
          @subscription = current_user.subscription
        end

        def cancel
          current_user.subscription.cancel!(reason: params[:reason])
          redirect_to subscription_path, notice: "Your subscription has been cancelled"
        end
      end
  - path: app/views/subscriptions/confirm_cancel.html.erb
    after: |
      <h1>Cancel your <%= @subscription.plan_name %> plan?</h1>
      <p>You will keep access until <%= l(@subscription.renews_on, format: :long) %>.</p>
      <%= button_to "Yes, cancel", cancel_subscription_path, method: :post, params: { reason: "email_link" }, class: "btn btn-danger" %>
      <%= link_to "Keep my plan", subscription_path %>
