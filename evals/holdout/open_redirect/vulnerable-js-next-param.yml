id: open_redirect-vulnerable-js-next-param
description: Front-end magic-link sign-in page sends the browser to the next query parameter after the token exchange succeeds
expected:
  open_redirect: true
files:
  - path: app/javascript/controllers/magic_link_controller.js
    after: |
      import { Controller } from "@hotwired/stimulus"

      export default class extends Controller {
        static values = { exchangeUrl: String }
        static targets = ["status"]

        async connect() {
          const params = new URLSearchParams(window.location.search)
          const token = params.get("token")
          if (!token) {
            this.statusTarget.textContent = "This sign-in link is missing its token."
            return
          }

          const response = await fetch(this.exchangeUrlValue, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRF-Token": document.querySelector("meta[name='csrf-token']").content
            },
            body: JSON.stringify({ token })
          })

          if (response.ok) {
            window.location.href = params.get("next") || "/dashboard"
          } else {
            this.statusTarget.textContent = "This link has expired. Request a new one."
          }
        }
      }
