id: xss-safe-search-highlight-helper
description: Forum search helper splits the excerpt on the query and builds mark tags with safe_join and tag helpers
expected:
  xss: false
files:
  - path: app/helpers/search_helper.rb
    before: |
      module SearchHelper
        def result_count_label(count)
          t("search.results", count: count)
        end

        def excerpt_for(post, query)
          excerpt(post.body, query, radius: 80) || truncate(post.body, length: 160)
        end
      end
    after: |
      module SearchHelper
        def result_count_label(count)
          t("search.results", count: count)
        end

        def excerpt_for(post, query)
          text = excerpt(post.body, query, radius: 80) || truncate(post.body, length: 160)
          return text if query.blank?

          parts = text.split(/(#{Regexp.escape(query)})/i)
          safe_join(parts.map { |part| part.casecmp?(query) ? tag.mark(part) : part })
        end
      end
