id: insecure_deserialization_rce-vulnerable-marshal-cookie
description: Saved-filter feature stores filters with Marshal in a plain cookie and Marshal.loads it back
expected:
  insecure_deserialization_rce: true
files:
  - path: app/controllers/concerns/saved_filters.rb
    before: |
      module SavedFilters
        extend ActiveSupport::Concern

        included do
          helper_method :saved_filters
        end

        def saved_filters
          {}
        end
      end
    after: |
      module SavedFilters
        extend ActiveSupport::Concern

        included do
          helper_method :saved_filters
        end

        def saved_filters
          raw = cookies[:saved_filters]
          return {} if raw.blank?

          Marshal.load(Base64.urlsafe_decode64(raw))
        rescue ArgumentError, TypeError
          {}
        end

        def save_filters!(filters)
          cookies[:saved_filters] = {
            value: Base64.urlsafe_encode64(Marshal.dump(filters.to_h)),
            expires: 6.months.from_now
          }
        end
      end
