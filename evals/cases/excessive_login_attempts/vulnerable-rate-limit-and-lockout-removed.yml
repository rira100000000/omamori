id: excessive_login_attempts-vulnerable-rate-limit-and-lockout-removed
description: Rails 8 sessions controller drops rate_limit and the failed-attempt lockout check
expected:
  excessive_login_attempts: true
files:
  - path: app/controllers/sessions_controller.rb
    before: |
      class SessionsController < ApplicationController
        allow_unauthenticated_access only: %i[new create]
        rate_limit to: 10, within: 3.minutes, only: :create, with: -> { redirect_to new_session_url, alert: "Try again later." }

        def new
        end

        def create
          user = User.find_by(email_address: params[:email_address])

          if user&.locked?
            redirect_to new_session_path, alert: "Account locked. Check your email to unlock."
          elsif user&.authenticate(params[:password])
            user.update!(failed_attempts: 0)
            start_new_session_for user
            redirect_to after_authentication_url
          else
            user&.register_failed_attempt!
            redirect_to new_session_path, alert: "Try another email address or password."
          end
        end

        def destroy
          terminate_session
          redirect_to new_session_path
        end
      end
    after: |
      class SessionsController < ApplicationController
        allow_unauthenticated_access only: %i[new create]

        def new
        end

        def create
          if user = User.authenticate_by(params.permit(:email_address, :password))
            start_new_session_for user
            redirect_to after_authentication_url
          else
            redirect_to new_session_path, alert: "Try another email address or password."
          end
        end

        def destroy
          terminate_session
          redirect_to new_session_path
        end
      end
