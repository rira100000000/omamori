id: excessive_login_attempts-safe-sessions-refactor-keeps-rate-limit
description: Rails 8 sessions controller switches to authenticate_by while keeping rate_limit and lockout
expected:
  excessive_login_attempts: false
files:
  - path: app/controllers/sessions_controller.rb
    before: |
      class SessionsController < ApplicationController
        allow_unauthenticated_access only: %i[new create]
        rate_limit to: 10, within: 3.minutes, only: :create, with: -> { redirect_to new_session_url, alert: "Try again later." }

        def new
        end

        def create
          user = User.find_by(email_address: params[:email_address])

          if user&.locked?
            redirect_to new_session_path, alert: "Account locked. Check your email to unlock."
          elsif user&.authenticate(params[:password])
            user.update!(failed_attempts: 0)
            start_new_session_for user
            redirect_to after_authentication_url
          else
            user&.register_failed_attempt!
            redirect_to new_session_path, alert: "Try another email address or password."
          end
        end
      end
    after: |
      class SessionsController < ApplicationController
        allow_unauthenticated_access only: %i[new create]
        rate_limit to: 10, within: 3.minutes, only: :create, with: -> { redirect_to new_session_url, alert: "Try again later." }
        rate_limit to: 30, within: 1.hour, by: -> { params[:email_address].to_s.downcase }, only: :create,
                   with: -> { redirect_to new_session_url, alert: "Try again later." }

        def new
        end

        def create
          email = params[:email_address].to_s.strip.downcase
          return redirect_to(new_session_path, alert: "Account locked. Check your email to unlock.") if User.locked_email?(email)

          if user = User.authenticate_by(email_address: email, password: params[:password])
            user.update!(failed_attempts: 0)
            start_new_session_for user
            redirect_to after_authentication_url
          else
            User.register_failed_attempt_for!(email)
            redirect_to new_session_path, alert: "Try another email address or password."
          end
        end
      end
