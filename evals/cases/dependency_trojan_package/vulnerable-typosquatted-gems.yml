id: dependency_trojan_package-vulnerable-typosquatted-gems
description: Gemfile adds misspelled lookalikes of nokogiri and rest-client
expected:
  dependency_trojan_package: true
files:
  - path: Gemfile
    before: |
      source "https://rubygems.org"

      ruby "3.3.5"

      gem "rails", "~> 7.2.1"
      gem "pg", "~> 1.5"
      gem "puma", ">= 6.0"
      gem "importmap-rails"
      gem "turbo-rails"
      gem "stimulus-rails"
      gem "jbuilder"
      gem "bootsnap", require: false
      gem "sidekiq", "~> 7.3"

      group :development, :test do
        gem "debug", platforms: %i[mri windows]
        gem "rspec-rails", "~> 7.0"
      end

      group :development do
        gem "web-console"
      end
    after: |
      source "https://rubygems.org"

      ruby "3.3.5"

      gem "rails", "~> 7.2.1"
      gem "pg", "~> 1.5"
      gem "puma", ">= 6.0"
      gem "importmap-rails"
      gem "turbo-rails"
      gem "stimulus-rails"
      gem "jbuilder"
      gem "bootsnap", require: false
      gem "sidekiq", "~> 7.3"

      # Feed import
      gem "nokogirl"
      gem "rest-cliient"

      group :development, :test do
        gem "debug", platforms: %i[mri windows]
        gem "rspec-rails", "~> 7.0"
      end

      group :development do
        gem "web-console"
      end
