id: dependency_trojan_package-safe-add-well-known-gems
description: Gemfile adds pundit, rack-attack and bundler-audit from rubygems.org
expected:
  dependency_trojan_package: false
files:
  - path: Gemfile
    before: |
      source "https://rubygems.org"

      ruby "3.3.5"

      gem "rails", "~> 7.2.1"
      gem "pg", "~> 1.5"
      gem "puma", ">= 6.0"
      gem "importmap-rails"
      gem "turbo-rails"
      gem "jbuilder"
      gem "bootsnap", require: false
      gem "devise", "~> 4.9"

      group :development, :test do
        gem "debug", platforms: %i[mri windows]
        gem "rspec-rails", "~> 7.0"
      end
    after: |
      source "https://rubygems.org"

      ruby "3.3.5"

      gem "rails", "~> 7.2.1"
      gem "pg", "~> 1.5"
      gem "puma", ">= 6.0"
      gem "importmap-rails"
      gem "turbo-rails"
      gem "jbuilder"
      gem "bootsnap", require: false
      gem "devise", "~> 4.9"
      gem "pundit", "~> 2.4"
      gem "rack-attack", "~> 6.7"

      group :development, :test do
        gem "debug", platforms: %i[mri windows]
        gem "rspec-rails", "~> 7.0"
        gem "bundler-audit", require: false
        gem "brakeman", require: false
      end
