id: over_logging-safe-login-attempt-metadata
description: Sessions controller logs sign-in outcome with user id and request id only, never the submitted credentials
expected:
  over_logging: false
files:
  - path: app/controllers/sessions_controller.rb
    before: |
      class SessionsController < ApplicationController
        skip_before_action :authenticate_user!, only: %i[new create]

        def new
        end

        def create
          user = User.find_by(email: session_params[:email].to_s.downcase)

          if user&.authenticate(session_params[:password])
            start_session_for(user)
            redirect_to after_sign_in_path, notice: "Signed in."
          else
            flash.now[:alert] = "Invalid email or password."
            render :new, status: :unprocessable_entity
          end
        end

        private

        def session_params
          params.require(:session).permit(:email, :password, :remember_me)
        end
      end
    after: |
      class SessionsController < ApplicationController
        skip_before_action :authenticate_user!, only: %i[new create]

        def new
        end

        def create
          user = User.find_by(email: session_params[:email].to_s.downcase)

          if user&.authenticate(session_params[:password])
            start_session_for(user)
            Rails.logger.info("[auth] sign-in succeeded user_id=#{user.id} request_id=#{request.request_id}")
            redirect_to after_sign_in_path, notice: "Signed in."
          else
            Rails.logger.info("[auth] sign-in failed known_user=#{user.present?} request_id=#{request.request_id}")
            flash.now[:alert] = "Invalid email or password."
            render :new, status: :unprocessable_entity
          end
        end

        private

        def session_params
          params.require(:session).permit(:email, :password, :remember_me)
        end
      end
