id: over_logging-vulnerable-login-params-inspect
description: Sessions controller logs the raw login params (including the password) on every sign-in attempt
expected:
  over_logging: true
files:
  - path: app/controllers/sessions_controller.rb
    before: |
      class SessionsController < ApplicationController
        skip_before_action :authenticate_user!, only: %i[new create]

        def new
        end

        def create
          user = User.find_by(email: session_params[:email].to_s.downcase)

          if user&.authenticate(session_params[:password])
            start_session_for(user)
            redirect_to after_sign_in_path, notice: "Signed in."
          else
            flash.now[:alert] = "Invalid email or password."
            render :new, status: :unprocessable_entity
          end
        end

        private

        def session_params
          params.require(:session).permit(:email, :password, :remember_me)
        end
      end
    after: |
      class SessionsController < ApplicationController
        skip_before_action :authenticate_user!, only: %i[new create]

        def new
        end

        def create
          Rails.logger.info("[auth] sign-in attempt params=#{session_params.to_h.inspect} ip=#{request.remote_ip}")
          user = User.find_by(email: session_params[:email].to_s.downcase)

          if user&.authenticate(session_params[:password])
            start_session_for(user)
            redirect_to after_sign_in_path, notice: "Signed in."
          else
            Rails.logger.warn("[auth] sign-in failed for #{session_params[:email]} with password=#{session_params[:password]}")
            flash.now[:alert] = "Invalid email or password."
            render :new, status: :unprocessable_entity
          end
        end

        private

        def session_params
          params.require(:session).permit(:email, :password, :remember_me)
        end
      end
