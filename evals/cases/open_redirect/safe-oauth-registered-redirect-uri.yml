id: open_redirect-safe-oauth-registered-redirect-uri
description: OAuth authorization endpoint accepts a redirect_uri parameter only when it exactly equals one of the client's registered redirect URIs
expected:
  open_redirect: false
files:
  - path: app/controllers/oauth/authorizations_controller.rb
    before: |
      module Oauth
        class AuthorizationsController < ApplicationController
          before_action :require_login

          def new
            @client = OauthClient.find_by!(uid: params[:client_id])
            session[:oauth_client_id] = @client.id
          end

          def create
            client = OauthClient.find(session.delete(:oauth_client_id))
            grant = client.grants.create!(user: current_user, scopes: client.default_scopes)
            redirect_to client.callback_url_with(code: grant.code), allow_other_host: true
          end
        end
      end
    after: |
      module Oauth
        class AuthorizationsController < ApplicationController
          before_action :require_login

          def new
            @client = OauthClient.find_by!(uid: params[:client_id])
            redirect_uri = params[:redirect_uri].presence || @client.redirect_uris.first
            unless @client.redirect_uris.include?(redirect_uri)
              render :invalid_redirect_uri, status: :bad_request
              return
            end

            session[:oauth_client_id] = @client.id
            session[:oauth_redirect_uri] = redirect_uri
            session[:oauth_state] = params[:state]
          end

          def create
            client = OauthClient.find(session.delete(:oauth_client_id))
            redirect_uri = session.delete(:oauth_redirect_uri)
            head :bad_request and return unless client.redirect_uris.include?(redirect_uri)

            grant = client.grants.create!(user: current_user, scopes: client.default_scopes)
            uri = URI.parse(redirect_uri)
            uri.query = [uri.query, { code: grant.code, state: session.delete(:oauth_state) }.compact.to_query].compact_blank.join("&")
            redirect_to uri.to_s, allow_other_host: true
          end
        end
      end
