id: two_factor_auth_missing-vulnerable-payout-skips-2fa
description: New bulk payout approval action is excluded from the recent two-factor verification filter
expected:
  two_factor_auth_missing: true
files:
  - path: app/controllers/admin/payouts_controller.rb
    before: |
      module Admin
        class PayoutsController < Admin::BaseController
          before_action :require_recent_two_factor!
          before_action :set_payout, only: %i[show approve]

          def index
            @payouts = Payout.pending.order(created_at: :desc).page(params[:page])
          end

          def show
          end

          def approve
            @payout.approve!(by: current_admin)
            redirect_to admin_payouts_path, notice: "Payout approved"
          end

          private

          def set_payout
            @payout = Payout.find(params[:id])
          end
        end
      end
    after: |
      module Admin
        class PayoutsController < Admin::BaseController
          before_action :require_recent_two_factor!, except: :bulk_approve
          before_action :set_payout, only: %i[show approve]

          def index
            @payouts = Payout.pending.order(created_at: :desc).page(params[:page])
          end

          def show
          end

          def approve
            @payout.approve!(by: current_admin)
            redirect_to admin_payouts_path, notice: "Payout approved"
          end

          def bulk_approve
            payouts = Payout.pending.where(id: params[:payout_ids])
            payouts.find_each { |payout| payout.approve!(by: current_admin) }
            redirect_to admin_payouts_path, notice: "#{payouts.size} payouts approved"
          end

          private

          def set_payout
            @payout = Payout.find(params[:id])
          end
        end
      end
  - path: config/routes.rb
    before: |
      Rails.application.routes.draw do
        namespace :admin do
          resources :payouts, only: %i[index show] do
            post :approve, on: :member
          end
          resources :users
        end
      end
    after: |
      Rails.application.routes.draw do
        namespace :admin do
          resources :payouts, only: %i[index show] do
            post :approve, on: :member
            post :bulk_approve, on: :collection
          end
          resources :users
        end
      end
