id: inappropriate_file_permissions-safe-upload-dir-restricted
description: Attachment storage service sets explicit modes on upload directories and files, group-shared but not world-accessible
expected:
  inappropriate_file_permissions: false
files:
  - path: app/services/attachment_store.rb
    before: |
      class AttachmentStore
        ROOT = Rails.root.join("storage", "attachments")

        def initialize(account)
          @account = account
        end

        def write(upload)
          dir = ROOT.join(@account.id.to_s)
          FileUtils.mkdir_p(dir)

          path = dir.join(SecureRandom.uuid + File.extname(upload.original_filename))
          File.binwrite(path, upload.read)
          path.to_s
        end

        def delete(path)
          File.delete(path) if File.exist?(path)
        end
      end
    after: |
      class AttachmentStore
        ROOT = Rails.root.join("storage", "attachments")

        def initialize(account)
          @account = account
        end

        def write(upload)
          dir = ROOT.join(@account.id.to_s)
          # the thumbnailer runs in the same group and needs to write next to the original
          FileUtils.mkdir_p(dir, mode: 0o770)

          path = dir.join(SecureRandom.uuid + File.extname(upload.original_filename))
          File.binwrite(path, upload.read)
          File.chmod(0o660, path)
          path.to_s
        end

        def delete(path)
          File.delete(path) if File.exist?(path)
        end
      end
