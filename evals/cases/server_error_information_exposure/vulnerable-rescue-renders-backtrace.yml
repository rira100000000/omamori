id: server_error_information_exposure-vulnerable-rescue-renders-backtrace
description: API base controller rescues all errors and returns message, backtrace and server versions as JSON
expected:
  server_error_information_exposure: true
files:
  - path: app/controllers/api/base_controller.rb
    before: |
      module Api
        class BaseController < ActionController::API
          include ActionController::HttpAuthentication::Token::ControllerMethods

          before_action :authenticate!

          rescue_from ActiveRecord::RecordNotFound do
            render json: { error: "not_found" }, status: :not_found
          end

          private

          def authenticate!
            authenticate_or_request_with_http_token do |token, _options|
              @current_client = ApiClient.find_by_token(token)
            end
          end

          attr_reader :current_client
        end
      end
    after: |
      module Api
        class BaseController < ActionController::API
          include ActionController::HttpAuthentication::Token::ControllerMethods

          before_action :authenticate!

          rescue_from StandardError do |e|
            render json: {
              error: e.class.name,
              message: e.message,
              backtrace: e.backtrace.first(20),
              server: { ruby: RUBY_VERSION, rails: Rails.version, host: Socket.gethostname, db: ActiveRecord::Base.connection.adapter_name }
            }, status: :internal_server_error
          end

          rescue_from ActiveRecord::RecordNotFound do
            render json: { error: "not_found" }, status: :not_found
          end

          private

          def authenticate!
            authenticate_or_request_with_http_token do |token, _options|
              @current_client = ApiClient.find_by_token(token)
            end
          end

          attr_reader :current_client
        end
      end
