id: server_error_information_exposure-safe-rescue-logs-generic
description: API base controller rescues errors, logs details server-side and returns a generic message with request id
expected:
  server_error_information_exposure: false
files:
  - path: app/controllers/api/base_controller.rb
    before: |
      module Api
        class BaseController < ActionController::API
          include ActionController::HttpAuthentication::Token::ControllerMethods

          before_action :authenticate!

          rescue_from ActiveRecord::RecordNotFound do
            render json: { error: "not_found" }, status: :not_found
          end

          private

          def authenticate!
            authenticate_or_request_with_http_token do |token, _options|
              @current_client = ApiClient.find_by_token(token)
            end
          end

          attr_reader :current_client
        end
      end
    after: |
      module Api
        class BaseController < ActionController::API
          include ActionController::HttpAuthentication::Token::ControllerMethods

          before_action :authenticate!

          rescue_from StandardError do |e|
            Rails.logger.error("[api] #{e.class}: #{e.message}\n#{e.backtrace&.first(20)&.join("\n")}")
            Rails.error.report(e, handled: true, context: { request_id: request.request_id })
            render json: { error: "internal_error", request_id: request.request_id }, status: :internal_server_error
          end

          rescue_from ActiveRecord::RecordNotFound do
            render json: { error: "not_found" }, status: :not_found
          end

          private

          def authenticate!
            authenticate_or_request_with_http_token do |token, _options|
              @current_client = ApiClient.find_by_token(token)
            end
          end

          attr_reader :current_client
        end
      end
