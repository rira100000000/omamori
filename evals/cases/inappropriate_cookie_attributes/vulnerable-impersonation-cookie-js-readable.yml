id: inappropriate_cookie_attributes-vulnerable-impersonation-cookie-js-readable
description: Admin impersonation stores the impersonating admin id in a signed cookie with httponly turned off so the frontend banner can read it
expected:
  inappropriate_cookie_attributes: true
files:
  - path: app/controllers/admin/impersonations_controller.rb
    before: |
      module Admin
        class ImpersonationsController < Admin::BaseController
          def create
            user = User.find(params[:user_id])
            AuditLog.record!(actor: current_admin, action: "impersonate", target: user)

            session[:impersonator_id] = current_admin.id
            session[:user_id] = user.id
            redirect_to root_path
          end

          def destroy
            admin_id = session.delete(:impersonator_id)
            session[:user_id] = nil
            redirect_to admin_user_path(admin_id)
          end
        end
      end
    after: |
      module Admin
        class ImpersonationsController < Admin::BaseController
          def create
            user = User.find(params[:user_id])
            AuditLog.record!(actor: current_admin, action: "impersonate", target: user)

            cookies.signed[:impersonator_id] = {
              value: current_admin.id,
              expires: 1.hour,
              httponly: false,
              secure: Rails.env.production?
            }
            session[:user_id] = user.id
            redirect_to root_path
          end

          def destroy
            admin_id = cookies.signed[:impersonator_id]
            cookies.delete(:impersonator_id)
            session[:user_id] = nil
            redirect_to admin_user_path(admin_id)
          end
        end
      end
  - path: app/controllers/application_controller.rb
    before: |
      class ApplicationController < ActionController::Base
        before_action :require_login

        private

        def current_admin
          @current_admin ||= Admin.find_by(id: session[:impersonator_id] || session[:admin_id])
        end
      end
    after: |
      class ApplicationController < ActionController::Base
        before_action :require_login

        private

        def current_admin
          @current_admin ||= Admin.find_by(id: cookies.signed[:impersonator_id] || session[:admin_id])
        end
      end
