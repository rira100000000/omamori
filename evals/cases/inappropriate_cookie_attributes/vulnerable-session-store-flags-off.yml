id: inappropriate_cookie_attributes-vulnerable-session-store-flags-off
description: Session store config turns off httponly and secure on the session cookie so frontend JS can read it
expected:
  inappropriate_cookie_attributes: true
files:
  - path: config/initializers/session_store.rb
    before: |
      Rails.application.config.session_store :cookie_store,
        key: "_dashboard_session",
        expire_after: 12.hours,
        secure: Rails.env.production?,
        httponly: true,
        same_site: :lax
    after: |
      # The SPA reads the session cookie to attach it to API calls
      Rails.application.config.session_store :cookie_store,
        key: "_dashboard_session",
        expire_after: 30.days,
        secure: false,
        httponly: false,
        same_site: :none
