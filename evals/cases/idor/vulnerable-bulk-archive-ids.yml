id: idor-vulnerable-bulk-archive-ids
description: Bulk archive action updates documents by a list of submitted ids without restricting them to the user's own documents
expected:
  idor: true
files:
  - path: app/controllers/documents_controller.rb
    before: |
      class DocumentsController < ApplicationController
        before_action :require_login
        before_action :set_document, only: [:show, :archive]

        def index
          @documents = current_user.documents.active.order(updated_at: :desc)
        end

        def show
        end

        def archive
          @document.update!(archived_at: Time.current)
          redirect_to documents_path, notice: "Archived"
        end

        private

        def set_document
          @document = current_user.documents.find(params[:id])
        end
      end
    after: |
      class DocumentsController < ApplicationController
        before_action :require_login
        before_action :set_document, only: [:show, :archive]

        def index
          @documents = current_user.documents.active.order(updated_at: :desc)
        end

        def show
        end

        def archive
          @document.update!(archived_at: Time.current)
          redirect_to documents_path, notice: "Archived"
        end

        def bulk_archive
          ids = Array(params[:document_ids]).map(&:to_i)
          count = Document.where(id: ids).update_all(archived_at: Time.current, updated_at: Time.current)
          redirect_to documents_path, notice: "#{count} documents archived"
        end

        private

        def set_document
          @document = current_user.documents.find(params[:id])
        end
      end
