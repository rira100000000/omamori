id: insufficient_encryption-safe-message-encryptor-credentials
description: New encryptor for stored partner API credentials uses ActiveSupport::MessageEncryptor with AES-256-GCM and a key derived from the app's key generator
expected:
  insufficient_encryption: false
files:
  - path: app/lib/credential_cipher.rb
    after: |
      class CredentialCipher
        SALT = "partner integration credentials v1".freeze

        def initialize(key_generator: Rails.application.key_generator)
          key = key_generator.generate_key(SALT, ActiveSupport::MessageEncryptor.key_len("aes-256-gcm"))
          @encryptor = ActiveSupport::MessageEncryptor.new(key, cipher: "aes-256-gcm")
        end

        def encrypt(plaintext)
          @encryptor.encrypt_and_sign(plaintext, purpose: :partner_credential)
        end

        def decrypt(token)
          @encryptor.decrypt_and_verify(token, purpose: :partner_credential)
        end
      end
  - path: app/models/partner_integration.rb
    before: |
      class PartnerIntegration < ApplicationRecord
        belongs_to :account

        validates :provider, inclusion: { in: %w[freee moneyforward] }
      end
    after: |
      class PartnerIntegration < ApplicationRecord
        belongs_to :account

        validates :provider, inclusion: { in: %w[freee moneyforward] }

        def api_secret
          CredentialCipher.new.decrypt(api_secret_ciphertext) if api_secret_ciphertext
        end

        def api_secret=(value)
          self.api_secret_ciphertext = CredentialCipher.new.encrypt(value)
        end
      end
