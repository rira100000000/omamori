id: insufficient_encryption-vulnerable-md5-password-digest
description: User model replaces has_secure_password with salted MD5 password hashing to match a legacy system
expected:
  insufficient_encryption: true
files:
  - path: app/models/user.rb
    before: |
      class User < ApplicationRecord
        has_secure_password

        has_many :orders, dependent: :destroy

        validates :email, presence: true, uniqueness: { case_sensitive: false }
        validates :password, length: { minimum: 12 }, allow_nil: true

        normalizes :email, with: ->(email) { email.strip.downcase }
      end
    after: |
      require "digest/md5"

      class User < ApplicationRecord
        attr_reader :password

        has_many :orders, dependent: :destroy

        validates :email, presence: true, uniqueness: { case_sensitive: false }
        validates :password, length: { minimum: 12 }, allow_nil: true

        normalizes :email, with: ->(email) { email.strip.downcase }

        def password=(raw)
          @password = raw
          self.password_salt = SecureRandom.hex(8)
          self.password_digest = Digest::MD5.hexdigest("#{password_salt}#{raw}")
        end

        def authenticate(raw)
          digest = Digest::MD5.hexdigest("#{password_salt}#{raw}")
          ActiveSupport::SecurityUtils.secure_compare(digest, password_digest) && self
        end
      end
