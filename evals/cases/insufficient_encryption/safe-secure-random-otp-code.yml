id: insufficient_encryption-safe-secure-random-otp-code
description: Password reset switches to a six-digit code generated with SecureRandom.random_number, stored as an HMAC digest with a short expiry and attempt limit
expected:
  insufficient_encryption: false
files:
  - path: app/models/password_reset.rb
    before: |
      class PasswordReset < ApplicationRecord
        belongs_to :user

        EXPIRES_IN = 30.minutes

        before_create :generate_token

        scope :active, -> { where(used_at: nil).where("created_at > ?", EXPIRES_IN.ago) }

        def self.find_active(token)
          active.find_by(token_digest: digest(token))
        end

        def self.digest(token)
          OpenSSL::HMAC.hexdigest("SHA256", Rails.application.secret_key_base, token)
        end

        attr_reader :token

        private

        def generate_token
          @token = SecureRandom.urlsafe_base64(32)
          self.token_digest = self.class.digest(@token)
        end
      end
    after: |
      class PasswordReset < ApplicationRecord
        belongs_to :user

        EXPIRES_IN = 10.minutes
        MAX_ATTEMPTS = 5

        before_create :generate_token

        scope :active, -> { where(used_at: nil).where("created_at > ?", EXPIRES_IN.ago).where("attempts < ?", MAX_ATTEMPTS) }

        def self.find_active(user, code)
          reset = active.where(user: user).order(created_at: :desc).first
          return unless reset

          reset.increment!(:attempts)
          reset if ActiveSupport::SecurityUtils.secure_compare(reset.token_digest, digest(code))
        end

        def self.digest(code)
          OpenSSL::HMAC.hexdigest("SHA256", Rails.application.secret_key_base, code)
        end

        attr_reader :token

        private

        def generate_token
          @token = format("%06d", SecureRandom.random_number(1_000_000))
          self.token_digest = self.class.digest(@token)
        end
      end
