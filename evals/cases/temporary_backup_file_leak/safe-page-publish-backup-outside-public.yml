id: temporary_backup_file_leak-safe-page-publish-backup-outside-public
description: Static page publisher keeps the previous HTML as a .bak copy, but in a tmp directory outside public/
expected:
  temporary_backup_file_leak: false
files:
  - path: app/services/static_page_publisher.rb
    before: |
      class StaticPagePublisher
        OUTPUT_DIR = Rails.root.join("public", "p")

        def initialize(page)
          @page = page
        end

        def publish!
          html = ApplicationController.render(
            template: "pages/static",
            layout: "static",
            assigns: { page: @page }
          )

          FileUtils.mkdir_p(OUTPUT_DIR)
          File.write(output_path, html)
          @page.update!(published_at: Time.current)
        end

        private

        def output_path
          OUTPUT_DIR.join("#{@page.slug}.html")
        end
      end
    after: |
      class StaticPagePublisher
        OUTPUT_DIR = Rails.root.join("public", "p")
        BACKUP_DIR = Rails.root.join("tmp", "page_backups")

        def initialize(page)
          @page = page
        end

        def publish!
          html = ApplicationController.render(
            template: "pages/static",
            layout: "static",
            assigns: { page: @page }
          )

          FileUtils.mkdir_p(OUTPUT_DIR)
          FileUtils.mkdir_p(BACKUP_DIR)
          # keep the previous version so editors can roll back quickly
          FileUtils.cp(output_path, backup_path) if File.exist?(output_path)
          File.write(output_path, html)
          @page.update!(published_at: Time.current)
        end

        def rollback!
          FileUtils.cp(backup_path, output_path) if File.exist?(backup_path)
        end

        private

        def output_path
          OUTPUT_DIR.join("#{@page.slug}.html")
        end

        def backup_path
          BACKUP_DIR.join("#{@page.id}.html.bak")
        end
      end
