id: inappropriate_password_policy-safe-password-change-controller
description: Password change action refactored to require current password and keep model validations
expected:
  inappropriate_password_policy: false
files:
  - path: app/controllers/settings/passwords_controller.rb
    before: |
      module Settings
        class PasswordsController < ApplicationController
          before_action :authenticate_user!

          def edit
          end

          def update
            if current_user.update(password_params)
              bypass_sign_in(current_user)
              redirect_to settings_path, notice: "Password updated"
            else
              render :edit, status: :unprocessable_entity
            end
          end

          private

          def password_params
            params.require(:user).permit(:password, :password_confirmation)
          end
        end
      end
    after: |
      module Settings
        class PasswordsController < ApplicationController
          before_action :authenticate_user!

          def edit
          end

          def update
            if current_user.update_with_password(password_params)
              bypass_sign_in(current_user)
              UserMailer.with(user: current_user).password_changed.deliver_later
              redirect_to settings_path, notice: "Password updated"
            else
              render :edit, status: :unprocessable_entity
            end
          end

          private

          def password_params
            params.require(:user).permit(:current_password, :password, :password_confirmation)
          end
        end
      end
