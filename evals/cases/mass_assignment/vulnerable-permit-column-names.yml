id: mass_assignment-vulnerable-permit-column-names
description: Project update permits every database column of Project, so members can change any attribute including the owner
expected:
  mass_assignment: true
files:
  - path: app/controllers/projects_controller.rb
    before: |
      class ProjectsController < ApplicationController
        before_action :authenticate_user!
        before_action :set_project, only: [:show, :edit, :update]

        def index
          @projects = current_user.projects.order(:name)
        end

        def show
        end

        def edit
        end

        def update
          if @project.update(project_params)
            redirect_to @project, notice: "Project updated"
          else
            render :edit, status: :unprocessable_entity
          end
        end

        private

        def set_project
          @project = current_user.projects.find(params[:id])
        end

        def project_params
          params.require(:project).permit(:name, :description, :due_on)
        end
      end
    after: |
      class ProjectsController < ApplicationController
