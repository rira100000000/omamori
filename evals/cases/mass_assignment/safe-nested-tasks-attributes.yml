id: mass_assignment-safe-nested-tasks-attributes
description: Project update starts accepting nested task attributes, permitting only task title, done flag, and removal
expected:
  mass_assignment: false
files:
  - path: app/models/project.rb
    before: |
      class Project < ApplicationRecord
        belongs_to :owner, class_name: "User"
        has_many :memberships, dependent: :destroy
        has_many :members, through: :memberships, source: :user
        has_many :tasks, -> { order(:position) }, dependent: :destroy

        validates :name, presence: true
      end
    after: |
      class Project < ApplicationRecord
        belongs_to :owner, class_name: "User"
        has_many :memberships, dependent: :destroy
        has_many :members, through: :memberships, source: :user
        has_many :tasks, -> { order(:position) }, dependent: :destroy

        accepts_nested_attributes_for :tasks, allow_destroy: true, reject_if: ->(attrs) { attrs["title"].blank? }

        validates :name, presence: true
      end
  - path: app/controllers/projects_controller.rb
    before: |
      class ProjectsController < ApplicationController
        before_action :authenticate_user!
        before_action :set_project, only: [:show, :edit, :update]

        def show
        end

        def edit
        end

        def update
          if @project.update(project_params)
            redirect_to @project, notice: "Project updated"
          else
            render :edit, status: :unprocessable_entity
          end
        end

        private

        def set_project
          @project = current_user.projects.find(params[:id])
        end

        def project_params
          params.require(:project).permit(:name, :description, :due_on)
        end
      end
    after: |
      class ProjectsController < ApplicationController
        before_action :authenticate_user!
        before_action :set_project, only: [:show, :edit, :update]

        def show
        end

        def edit
        end

        def update
          if @project.update(project_params)
            redirect_to @project, notice: "Project updated"
          else
            render :edit, status: :unprocessable_entity
          end
        end

        private

        def set_project
          @project = current_user.projects.find(params[:id])
        end

        def project_params
          params.require(:project).permit(
            :name, :description, :due_on,
            tasks_attributes: [:id, :title, :done, :_destroy]
          )
        end
      end
