id: mass_assignment-safe-staff-check-permits-plan
description: Organization settings form also exposes plan and seat limit fields when the signed-in user is staff
expected:
  mass_assignment: false
files:
  - path: app/controllers/organizations_controller.rb
    before: |
      class OrganizationsController < ApplicationController
        before_action :authenticate_user!
        before_action :set_organization

        def edit
        end

        def update
          if @organization.update(organization_params)
            redirect_to edit_organization_path(@organization), notice: "Settings saved"
          else
            render :edit, status: :unprocessable_entity
          end
        end

        private

        def set_organization
          @organization = current_user.organizations.find(params[:id])
        end

        def organization_params
          params.require(:organization).permit(:name, :billing_email, :logo)
        end
      end
    after: |
      class OrganizationsController < ApplicationController
        before_action :authenticate_user!
        before_action :set_organization

        def edit
          @admin_mode = current_user.staff?
        end

        def update
          if @organization.update(organization_params)
            redirect_to edit_organization_path(@organization), notice: "Settings saved"
          else
            @admin_mode = current_user.staff?
            render :edit, status: :unprocessable_entity
          end
        end

        private

        def set_organization
          @organization = current_user.organizations.find(params[:id])
        end

        def organization_params
          fields = [:name, :billing_email, :logo]
          fields += [:plan, :seat_limit, :trial_ends_on] if current_user.staff?
          params.require(:organization).permit(*fields)
        end
      end
  - path: app/views/organizations/edit.html.erb
    before: |
      <h1><%= @organization.name %> settings</h1>

      <%= form_with model: @organization do |f| %>
        <%= f.label :name %>
        <%= f.text_field :name %>

        <%= f.label :billing_email %>
        <%= f.email_field :billing_email %>

        <%= f.label :logo %>
        <%= f.file_field :logo %>

        <%= f.submit "Save" %>
      <% end %>
    after: |
      <h1><%= @organization.name %> settings</h1>

      <%= form_with model: @organization do |f| %>
        <%= f.label :name %>
        <%= f.text_field :name %>

        <%= f.label :billing_email %>
        <%= f.email_field :billing_email %>

        <%= f.label :logo %>
        <%= f.file_field :logo %>

        <% if @admin_mode %>
          <fieldset>
            <legend>Billing</legend>
            <%= f.label :plan %>
            <%= f.select :plan, Organization.plans.keys %>

            <%= f.label :seat_limit %>
            <%= f.number_field :seat_limit %>

            <%= f.label :trial_ends_on %>
            <%= f.date_field :trial_ends_on %>
          </fieldset>
        <% end %>

        <%= f.submit "Save" %>
      <% end %>
