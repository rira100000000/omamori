id: mass_assignment-safe-client-chosen-fields-intersected
description: Inline profile editing endpoint permits the requested field names only where they appear in a fixed list of profile fields
expected:
  mass_assignment: false
files:
  - path: app/controllers/profiles_controller.rb
    before: |
      class ProfilesController < ApplicationController
        before_action :authenticate_user!

        def show
          @user = current_user
        end

        def update
          if current_user.update(profile_params)
            redirect_to profile_path, notice: "Profile saved"
          else
            @user = current_user
            render :show, status: :unprocessable_entity
          end
        end

        private

        def profile_params
          params.require(:user).permit(:display_name, :bio, :location, :website)
        end
      end
    after: |
      class ProfilesController < ApplicationController
        PROFILE_FIELDS = %w[display_name bio location website].freeze

        before_action :authenticate_user!

        def show
          @user = current_user
        end

        def update
          if current_user.update(profile_params)
            redirect_to profile_path, notice: "Profile saved"
          else
            @user = current_user
            render :show, status: :unprocessable_entity
          end
        end

        def inline_update
          fields = PROFILE_FIELDS & Array(params[:fields])
          if current_user.update(params.require(:user).permit(*fields))
            render json: current_user.slice(*fields)
          else
            render json: { errors: current_user.errors }, status: :unprocessable_entity
          end
        end

        private

        def profile_params
          params.require(:user).permit(*PROFILE_FIELDS)
        end
      end
