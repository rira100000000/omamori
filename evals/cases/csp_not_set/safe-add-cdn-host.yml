id: csp_not_set-safe-add-cdn-host
description: CSP initializer allows one more specific HTTPS host for scripts and connections, keeping nonces and no unsafe sources
expected:
  csp_not_set: false
files:
  - path: config/initializers/content_security_policy.rb
    before: |
      # Be sure to restart your server when you modify this file.

      Rails.application.configure do
        config.content_security_policy do |policy|
          policy.default_src :self
          policy.font_src    :self, "https://fonts.gstatic.com"
          policy.img_src     :self, :data, "https://images.example-cdn.com"
          policy.object_src  :none
          policy.script_src  :self
          policy.style_src   :self, "https://fonts.googleapis.com"
          policy.connect_src :self
          policy.frame_ancestors :self
          policy.base_uri    :self
          policy.form_action :self
          policy.report_uri  "/csp-violation-report"
        end

        config.content_security_policy_nonce_generator = ->(request) { SecureRandom.base64(16) }
        config.content_security_policy_nonce_directives = %w[script-src style-src]
      end
    after: |
      # Be sure to restart your server when you modify this file.

      Rails.application.configure do
        config.content_security_policy do |policy|
          policy.default_src :self
          policy.font_src    :self, "https://fonts.gstatic.com"
          policy.img_src     :self, :data, "https://images.example-cdn.com"
          policy.object_src  :none
          policy.script_src  :self, "https://widget.example-chat.io"
          policy.style_src   :self, "https://fonts.googleapis.com"
          policy.connect_src :self, "wss://widget.example-chat.io"
          policy.frame_ancestors :self
          policy.base_uri    :self
          policy.form_action :self
          policy.report_uri  "/csp-violation-report"
        end

        config.content_security_policy_nonce_generator = ->(request) { SecureRandom.base64(16) }
        config.content_security_policy_nonce_directives = %w[script-src style-src]
      end
