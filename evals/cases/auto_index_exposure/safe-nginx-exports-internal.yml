id: auto_index_exposure-safe-nginx-exports-internal
description: Nginx config adds a /exports/ alias for generated reports as an internal X-Accel location with autoindex off
expected:
  auto_index_exposure: false
files:
  - path: config/deploy/nginx/reports.conf
    before: |
      upstream app {
          server unix:/var/www/reports/shared/tmp/sockets/puma.sock fail_timeout=0;
      }

      server {
          listen 443 ssl http2;
          server_name reports.example.com;

          ssl_certificate     /etc/letsencrypt/live/reports.example.com/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;

          root /var/www/reports/current/public;
          client_max_body_size 20m;

          location ^~ /assets/ {
              gzip_static on;
              expires max;
              add_header Cache-Control public;
          }

          location / {
              try_files $uri @app;
          }

          location @app {
              proxy_pass http://app;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
    after: |
      upstream app {
          server unix:/var/www/reports/shared/tmp/sockets/puma.sock fail_timeout=0;
      }

      server {
          listen 443 ssl http2;
          server_name reports.example.com;

          ssl_certificate     /etc/letsencrypt/live/reports.example.com/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;

          root /var/www/reports/current/public;
          client_max_body_size 20m;

          location ^~ /assets/ {
              gzip_static on;
              expires max;
              add_header Cache-Control public;
          }

          location /exports/ {
              internal;
              alias /var/www/reports/shared/exports/;
              autoindex off;
          }

          location / {
              try_files $uri @app;
          }

          location @app {
              proxy_pass http://app;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Sendfile-Type X-Accel-Redirect;
              proxy_set_header X-Accel-Mapping /var/www/reports/shared/exports/=/exports/;
          }
      }
