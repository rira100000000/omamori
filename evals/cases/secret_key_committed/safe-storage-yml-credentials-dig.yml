id: secret_key_committed-safe-storage-yml-credentials-dig
description: Active Storage config for a new S3-compatible bucket reads its access key id and secret access key from Rails credentials
expected:
  secret_key_committed: false
files:
  - path: config/storage.yml
    before: |
      test:
        service: Disk
        root: <%= Rails.root.join("tmp/storage") %>

      local:
        service: Disk
        root: <%= Rails.root.join("storage") %>

      amazon:
        service: S3
        access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
        secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
        region: ap-northeast-1
        bucket: ledger-production-uploads
    after: |
      test:
        service: Disk
        root: <%= Rails.root.join("tmp/storage") %>

      local:
        service: Disk
        root: <%= Rails.root.join("storage") %>

      amazon:
        service: S3
        access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
        secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
        region: ap-northeast-1
        bucket: ledger-production-uploads

      r2_exports:
        service: S3
        endpoint: <%= ENV.fetch("R2_ENDPOINT", "https://exports.r2.example.com") %>
        access_key_id: <%= Rails.application.credentials.dig(:r2, :access_key_id) %>
        secret_access_key: <%= Rails.application.credentials.dig(:r2, :secret_access_key) %>
        region: auto
        bucket: ledger-exports
  - path: config/environments/production.rb
    before: |
      Rails.application.configure do
        config.eager_load = true
        config.force_ssl = true
        config.active_storage.service = :amazon
      end
    after: |
      Rails.application.configure do
        config.eager_load = true
        config.force_ssl = true
        config.active_storage.service = :amazon
        config.x.exports_storage_service = :r2_exports
      end
