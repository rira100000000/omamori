id: secret_key_committed-vulnerable-database-yml-password
description: Production database password in database.yml is changed from an ENV lookup to a literal value
expected:
  secret_key_committed: true
files:
  - path: config/database.yml
    before: |
      default: &default
        adapter: postgresql
        encoding: unicode
        pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

      development:
        <<: *default
        database: shopfront_development

      test:
        <<: *default
        database: shopfront_test

      production:
        <<: *default
        host: <%= ENV["DATABASE_HOST"] %>
        database: shopfront_production
        username: shopfront
        password: <%= ENV["SHOPFRONT_DATABASE_PASSWORD"] %>
    after: |
      default: &default
        adapter: postgresql
        encoding: unicode
        pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

      development:
        <<: *default
        database: shopfront_development

      test:
        <<: *default
        database: shopfront_test

      production:
        <<: *default
        host: db-primary.internal.shopfront.example
        database: shopfront_production
        username: shopfront
        password: omamori-eval-dummy-dbpass-9d27b1
