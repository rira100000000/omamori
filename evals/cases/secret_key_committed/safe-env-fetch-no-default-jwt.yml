id: secret_key_committed-safe-env-fetch-no-default-jwt
description: JWT initializer reads the signing secret from credentials or JWT_SECRET with no literal fallback, so boot fails if neither is set
expected:
  secret_key_committed: false
files:
  - path: config/initializers/jwt.rb
    before: |
      Rails.application.config.x.jwt = ActiveSupport::OrderedOptions.new.tap do |jwt|
        jwt.algorithm = "HS256"
        jwt.issuer = "ledger-api"
        jwt.ttl = 15.minutes
      end
    after: |
      Rails.application.config.x.jwt = ActiveSupport::OrderedOptions.new.tap do |jwt|
        jwt.algorithm = "HS256"
        jwt.issuer = "ledger-api"
        jwt.ttl = 15.minutes
        jwt.secret = Rails.application.credentials.jwt_secret || ENV.fetch("JWT_SECRET")
      end
  - path: app/services/access_token.rb
    after: |
      class AccessToken
        def self.encode(user)
          cfg = Rails.configuration.x.jwt
          payload = { sub: user.id, iss: cfg.issuer, exp: cfg.ttl.from_now.to_i }
          JWT.encode(payload, cfg.secret, cfg.algorithm)
        end

        def self.decode(token)
          cfg = Rails.configuration.x.jwt
          JWT.decode(token, cfg.secret, true, algorithm: cfg.algorithm, iss: cfg.issuer, verify_iss: true).first
        end
      end
