id: secret_key_committed-safe-ci-workflow-secrets-context
description: CI workflow adds a test job with a throwaway Postgres service container password and takes the deploy master key from GitHub secrets
expected:
  secret_key_committed: false
files:
  - path: .github/workflows/ci.yml
    before: |
      name: CI

      on:
        pull_request:
        push:
          branches: [main]

      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                bundler-cache: true
            - run: bin/rubocop -f github
    after: |
      name: CI

      on:
        pull_request:
        push:
          branches: [main]

      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                bundler-cache: true
            - run: bin/rubocop -f github

        test:
          runs-on: ubuntu-latest
          services:
            postgres:
              image: postgres:17
              env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
              ports: ["5432:5432"]
              options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
          env:
            RAILS_ENV: test
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/ledger_test
          steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                bundler-cache: true
            - run: bin/rails db:test:prepare
            - run: bin/rails test

        deploy:
          needs: [lint, test]
          if: github.ref == 'refs/heads/main'
          runs-on: ubuntu-latest
          env:
            RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
            KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                bundler-cache: true
            - run: bin/kamal deploy
