id: secret_key_committed-safe-client-key-from-credentials
description: New shipping-rate API client reads its API key and signing secret from Rails credentials
expected:
  secret_key_committed: false
files:
  - path: app/services/shipping/rate_client.rb
    after: |
      require "openssl"

      module Shipping
        class RateClient
          BASE_URL = "https://api.parcelrates.example.com/v2"

          def initialize(http: Faraday.new(url: BASE_URL),
                         api_key: Rails.application.credentials.dig(:parcelrates, :api_key),
                         signing_secret: Rails.application.credentials.dig(:parcelrates, :signing_secret))
            @http = http
            @api_key = api_key or raise ArgumentError, "parcelrates api_key is not configured"
            @signing_secret = signing_secret or raise ArgumentError, "parcelrates signing_secret is not configured"
          end

          def quote(from:, to:, weight_grams:)
            body = { from: from, to: to, weight: weight_grams }.to_json
            response = @http.post("rates") do |req|
              req.headers["Content-Type"] = "application/json"
              req.headers["X-Api-Key"] = @api_key
              req.headers["X-Signature"] = OpenSSL::HMAC.hexdigest("SHA256", @signing_secret, body)
              req.body = body
            end
            JSON.parse(response.body).fetch("rates")
          end
        end
      end
