id: csrf-vulnerable-get-cancel-subscription
description: Subscription cancellation moves to a GET route so it can be linked from emails, performing the state change on GET
expected:
  csrf: true
files:
  - path: config/routes.rb
    before: |
      Rails.application.routes.draw do
        root "dashboard#show"

        resource :session, only: [:new, :create, :destroy]
        resources :subscriptions, only: [:index, :show, :create] do
          member do
            post :cancel
          end
        end
        resources :invoices, only: [:index, :show]
      end
    after: |
      Rails.application.routes.draw do
        root "dashboard#show"

        resource :session, only: [:new, :create, :destroy]
        resources :subscriptions, only: [:index, :show, :create] do
          member do
            get :cancel
          end
        end
        resources :invoices, only: [:index, :show]
      end
  - path: app/controllers/subscriptions_controller.rb
    before: |
      class SubscriptionsController < ApplicationController
        before_action :require_login
        before_action :set_subscription, only: [:show, :cancel]

        def index
          @subscriptions = current_user.subscriptions.order(created_at: :desc)
        end

        def show
        end

        def cancel
          @subscription.cancel!(reason: params[:reason])
          redirect_to subscriptions_path, notice: "Subscription cancelled"
        end

        private

        def set_subscription
          @subscription = current_user.subscriptions.find(params[:id])
        end
      end
    after: |
      class SubscriptionsController < ApplicationController
        before_action :require_login
        before_action :set_subscription, only: [:show, :cancel]

        def index
          @subscriptions = current_user.subscriptions.order(created_at: :desc)
        end

        def show
        end

        # Linked directly from the renewal reminder email
        def cancel
          @subscription.cancel!(reason: params[:reason] || "email_link")
          redirect_to subscriptions_path, notice: "Subscription cancelled"
        end

        private

        def set_subscription
          @subscription = current_user.subscriptions.find(params[:id])
        end
      end
