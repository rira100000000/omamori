id: session_fixation-vulnerable-session-id-from-query
description: Rack middleware lets a sid query parameter set the session cookie for mobile webview handoff
expected:
  session_fixation: true
files:
  - path: app/middleware/webview_session_handoff.rb
    after: |
      class WebviewSessionHandoff
        COOKIE_NAME = "_shop_session".freeze

        def initialize(app)
          @app = app
        end

        def call(env)
          request = Rack::Request.new(env)
          sid = request.params["sid"]

          if sid.present? && request.get?
            cookies = request.cookies.merge(COOKIE_NAME => sid)
            env["HTTP_COOKIE"] = cookies.map { |k, v| "#{k}=#{v}" }.join("; ")

            status, headers, body = @app.call(env)
            Rack::Utils.set_cookie_header!(headers, COOKIE_NAME, value: sid, path: "/", httponly: true, secure: true)
            return [status, headers, body]
          end

          @app.call(env)
        end
      end
  - path: config/application.rb
    before: |
      require_relative "boot"
      require "rails/all"

      Bundler.require(*Rails.groups)

      module Shop
        class Application < Rails::Application
          config.load_defaults 7.1
          config.time_zone = "Tokyo"
          config.session_store :cookie_store, key: "_shop_session"
        end
      end
    after: |
      require_relative "boot"
      require "rails/all"
      require_relative "../app/middleware/webview_session_handoff"

      Bundler.require(*Rails.groups)

      module Shop
        class Application < Rails::Application
          config.load_defaults 7.1
          config.time_zone = "Tokyo"
          config.session_store :cache_store, key: "_shop_session"
          config.middleware.insert_before ActionDispatch::Cookies, WebviewSessionHandoff
        end
      end
