id: session_fixation-safe-rails8-db-session-record
description: Rails 8 style authentication concern creates a new Session record on each sign-in and stores its server-generated id in a signed cookie
expected:
  session_fixation: false
files:
  - path: app/controllers/concerns/authentication.rb
    after: |
      module Authentication
        extend ActiveSupport::Concern

        included do
          before_action :require_authentication
          helper_method :authenticated?
        end

        private

        def authenticated?
          resume_session.present?
        end

        def require_authentication
          resume_session || request_authentication
        end

        def resume_session
          Current.session ||= find_session_by_cookie
        end

        def find_session_by_cookie
          Session.find_by(id: cookies.signed[:session_id]) if cookies.signed[:session_id]
        end

        def request_authentication
          session[:return_to_after_authenticating] = request.url
          redirect_to new_session_path
        end

        def start_new_session_for(user)
          user.sessions.create!(user_agent: request.user_agent, ip_address: request.remote_ip).tap do |new_session|
            Current.session = new_session
            cookies.signed.permanent[:session_id] = { value: new_session.id, httponly: true, same_site: :lax }
          end
        end

        def terminate_session
          Current.session.destroy
          cookies.delete(:session_id)
        end
      end
  - path: app/controllers/sessions_controller.rb
    after: |
      class SessionsController < ApplicationController
        allow_unauthenticated_access only: %i[new create]
        rate_limit to: 10, within: 3.minutes, only: :create

        def new
        end

        def create
          if user = User.authenticate_by(params.permit(:email_address, :password))
            start_new_session_for user
            redirect_to session.delete(:return_to_after_authenticating) || root_url
          else
            redirect_to new_session_path, alert: "Try another email address or password."
          end
        end

        def destroy
          terminate_session
          redirect_to new_session_path
        end
      end
