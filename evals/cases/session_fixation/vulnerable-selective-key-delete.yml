id: session_fixation-vulnerable-selective-key-delete
description: To keep the guest locale and onboarding state, login replaces reset_session with deleting a few session keys, so the session id is not rotated
expected:
  session_fixation: true
files:
  - path: app/controllers/sessions_controller.rb
    before: |
      class SessionsController < ApplicationController
        skip_before_action :require_login, only: [:new, :create]

        def create
          user = User.find_by(email: params[:email].to_s.downcase)
          if user&.authenticate(params[:password])
            reset_session
            session[:user_id] = user.id
            session[:role] = user.role
            redirect_to dashboard_path
          else
            flash.now[:alert] = "Invalid email or password"
            render :new, status: :unprocessable_entity
          end
        end

        def destroy
          reset_session
          redirect_to root_path
        end
      end
    after: |
      class SessionsController < ApplicationController
        skip_before_action :require_login, only: [:new, :create]

        STALE_KEYS = %i[user_id role impersonator_id].freeze

        def create
          user = User.find_by(email: params[:email].to_s.downcase)
          if user&.authenticate(params[:password])
            STALE_KEYS.each { |key| session.delete(key) }
            session[:user_id] = user.id
            session[:role] = user.role
            redirect_to session.delete(:onboarding_step) ? onboarding_path : dashboard_path
          else
            flash.now[:alert] = "Invalid email or password"
            render :new, status: :unprocessable_entity
          end
        end

        def destroy
          reset_session
          redirect_to root_path
        end
      end
