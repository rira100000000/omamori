id: sql_injection-safe-tenant-header-search-path
description: API base controller switches the PostgreSQL schema per request using the X-Tenant header, rejecting values outside a strict identifier pattern and quoting the schema name
expected:
  sql_injection: false
files:
  - path: app/controllers/api/base_controller.rb
    before: |
      module Api
        class BaseController < ActionController::API
          include ActionController::HttpAuthentication::Token::ControllerMethods

          before_action :authenticate_client!

          rescue_from ActiveRecord::RecordNotFound do
            render json: { error: "not_found" }, status: :not_found
          end

          private

          def authenticate_client!
            authenticate_or_request_with_http_token do |token, _options|
              @current_client = ApiClient.active.find_by(token_digest: ApiClient.digest(token))
            end
          end

          attr_reader :current_client
        end
      end
    after: |
      module Api
        class BaseController < ActionController::API
          include ActionController::HttpAuthentication::Token::ControllerMethods

          before_action :authenticate_client!
          around_action :switch_tenant

          rescue_from ActiveRecord::RecordNotFound do
            render json: { error: "not_found" }, status: :not_found
          end

          private

          def authenticate_client!
            authenticate_or_request_with_http_token do |token, _options|
              @current_client = ApiClient.active.find_by(token_digest: ApiClient.digest(token))
            end
          end

          TENANT_FORMAT = /\A[a-z][a-z0-9_]{0,62}\z/

          def switch_tenant
            tenant = request.headers["X-Tenant"].presence || "public"
            unless TENANT_FORMAT.match?(tenant)
              return render json: { error: "unknown_tenant" }, status: :bad_request
            end

            connection = ActiveRecord::Base.connection
            connection.execute("SET search_path TO #{connection.quote_table_name(tenant)}, public")
            yield
          ensure
            ActiveRecord::Base.connection.execute("SET search_path TO public")
          end

          attr_reader :current_client
        end
      end
