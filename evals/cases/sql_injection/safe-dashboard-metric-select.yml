id: sql_injection-safe-dashboard-metric-select
description: Dashboard chart endpoint lets the client choose the metric and grouping by key, looking up the SQL expressions in fixed hashes before passing them to group and pluck
expected:
  sql_injection: false
files:
  - path: app/controllers/dashboard/charts_controller.rb
    before: |
      module Dashboard
        class ChartsController < ApplicationController
          before_action :authenticate_user!

          def show
            orders = current_account.orders
                                    .where(paid_at: range)
                                    .group("DATE(orders.paid_at)")
                                    .order("DATE(orders.paid_at)")
                                    .sum(:total_cents)

            render json: orders.map { |day, value| { label: day, value: value } }
          end

          private

          def range
            days = params.fetch(:days, 30).to_i.clamp(1, 365)
            days.days.ago.beginning_of_day..Time.current
          end
        end
      end
    after: |
      module Dashboard
        class ChartsController < ApplicationController
          METRICS = {
            "revenue" => "SUM(orders.total_cents)",
            "orders" => "COUNT(*)",
            "average" => "AVG(orders.total_cents)",
            "customers" => "COUNT(DISTINCT orders.customer_id)"
          }.freeze

          DIMENSIONS = {
            "day" => "DATE(orders.paid_at)",
            "week" => "DATE_TRUNC('week', orders.paid_at)",
            "channel" => "orders.channel"
          }.freeze

          before_action :authenticate_user!

          def show
            metric = METRICS.fetch(params[:metric].to_s, METRICS["revenue"])
            dimension = DIMENSIONS.fetch(params[:dimension].to_s, DIMENSIONS["day"])

            rows = current_account.orders
                                  .where(paid_at: range)
                                  .group(Arel.sql(dimension))
                                  .order(Arel.sql(dimension))
                                  .pluck(Arel.sql(dimension), Arel.sql(metric))

            render json: rows.map { |label, value| { label: label, value: value } }
          end

          private

          def range
            days = params.fetch(:days, 30).to_i.clamp(1, 365)
            days.days.ago.beginning_of_day..Time.current
          end
        end
      end
