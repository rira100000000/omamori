id: sql_injection-safe-sanitize-sql-like-company-search
description: Company directory search escapes the query with sanitize_sql_like and passes the LIKE patterns as bound values
expected:
  sql_injection: false
files:
  - path: app/models/company.rb
    before: |
      class Company < ApplicationRecord
        belongs_to :workspace
        has_many :contacts, dependent: :destroy
        has_many :deals, dependent: :nullify

        validates :name, presence: true
        validates :domain, uniqueness: { scope: :workspace_id }, allow_blank: true

        scope :active, -> { where(archived_at: nil) }

        def display_domain
          domain.presence || "-"
        end
      end
    after: |
      class Company < ApplicationRecord
        belongs_to :workspace
        has_many :contacts, dependent: :destroy
        has_many :deals, dependent: :nullify

        validates :name, presence: true
        validates :domain, uniqueness: { scope: :workspace_id }, allow_blank: true

        scope :active, -> { where(archived_at: nil) }

        def self.matching(query)
          term = sanitize_sql_like(query.to_s.strip.downcase)
          where("LOWER(companies.name) LIKE ? OR LOWER(companies.domain) LIKE ?", "%#{term}%", "#{term}%")
        end

        def display_domain
          domain.presence || "-"
        end
      end
  - path: app/controllers/companies_controller.rb
    before: |
      class CompaniesController < ApplicationController
        def index
          @companies = current_workspace.companies.active.order(:name).page(params[:page])
        end
      end
    after: |
      class CompaniesController < ApplicationController
        def index
          @companies = current_workspace.companies.active.order(:name)
          @companies = @companies.matching(params[:q]) if params[:q].present?
          @companies = @companies.page(params[:page])
        end
      end
