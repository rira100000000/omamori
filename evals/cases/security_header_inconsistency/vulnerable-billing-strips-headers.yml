id: security_header_inconsistency-vulnerable-billing-strips-headers
description: Billing controller removes the frame, HSTS and content-type headers that the rest of the app sends
expected:
  security_header_inconsistency: true
files:
  - path: app/controllers/billing_controller.rb
    before: |
      class BillingController < ApplicationController
        before_action :authenticate_user!

        def show
          @subscription = current_user.subscription
          @invoices = current_user.invoices.order(issued_at: :desc).limit(12)
        end

        def update_card
          current_user.subscription.update_payment_method!(params.require(:payment_method_id))
          redirect_to billing_path, notice: "Card updated"
        end
      end
    after: |
      class BillingController < ApplicationController
        before_action :authenticate_user!
        after_action :relax_headers

        def show
          @subscription = current_user.subscription
          @invoices = current_user.invoices.order(issued_at: :desc).limit(12)
        end

        def update_card
          current_user.subscription.update_payment_method!(params.require(:payment_method_id))
          redirect_to billing_path, notice: "Card updated"
        end

        private

        def relax_headers
          response.headers.delete("X-Frame-Options")
          response.headers.delete("Strict-Transport-Security")
          response.headers.delete("X-Content-Type-Options")
          response.headers["Content-Security-Policy"] = "default-src * 'unsafe-inline' 'unsafe-eval'"
        end
      end
