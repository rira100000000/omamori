id: dangerous_eval-vulnerable-public-send-scope
description: Products index applies a filter by calling public_send with the raw scope param on the model class
expected:
  dangerous_eval: true
files:
  - path: app/controllers/admin/products_controller.rb
    before: |
      module Admin
        class ProductsController < Admin::BaseController
          def index
            @products = Product.includes(:category)
                               .order(updated_at: :desc)
                               .page(params[:page])
          end

          def show
            @product = Product.find(params[:id])
          end

          def update
            @product = Product.find(params[:id])
            if @product.update(product_params)
              redirect_to admin_product_path(@product), notice: "Saved"
            else
              render :show, status: :unprocessable_entity
            end
          end

          private

          def product_params
            params.require(:product).permit(:name, :price_cents, :category_id, :published)
          end
        end
      end
    after: |
      module Admin
        class ProductsController < Admin::BaseController
          def index
            scope = params[:filter].presence || "all"
            @products = Product.public_send(scope)
                               .includes(:category)
                               .order(updated_at: :desc)
                               .page(params[:page])
          end

          def show
            @product = Product.find(params[:id])
          end

          def update
            @product = Product.find(params[:id])
            if @product.update(product_params)
              redirect_to admin_product_path(@product), notice: "Saved"
            else
              render :show, status: :unprocessable_entity
            end
          end

          private

          def product_params
            params.require(:product).permit(:name, :price_cents, :category_id, :published)
          end
        end
      end
